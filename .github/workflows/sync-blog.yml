# main 에 push 하면 노트(.md)와 이미지를 ahmola.github.io 저장소의 blog/notes 로 복사해 커밋합니다.
# 그 커밋이 ahmola.github.io 의 "Deploy" 워크플로를 실행해서 ahmola.github.io/blog 에 반영됩니다.
#
# 필요한 설정: 이 저장소 Settings → Secrets and variables → Actions 에
#   BLOG_SYNC_TOKEN = ahmola.github.io 저장소 Contents 쓰기 권한이 있는 fine-grained 토큰
name: Sync notes to blog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v7
        with:
          path: source

      - name: Checkout ahmola.github.io
        uses: actions/checkout@v7
        with:
          repository: ahmola/ahmola.github.io
          token: ${{ secrets.BLOG_SYNC_TOKEN }}
          path: target

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 어떤 파일을 복사/제외할지는 ahmola.github.io/blog/scripts/sync-notes.mjs 에 정의되어 있습니다.
      - name: Copy notes
        run: node target/blog/scripts/sync-notes.mjs source target/blog/notes

      - name: Commit & push (변경이 있을 때만)
        working-directory: target
        run: |
          git add blog/notes
          if git diff --cached --quiet; then
            echo "No changes in notes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync notes from ComputerScience@${GITHUB_SHA::7}"
          git push
